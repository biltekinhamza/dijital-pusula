<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="shd-title shd-desc">
  <title id="shd-title">Soğuk Hava Deposu Yönetim Sistemi — 3D yerleşim ekranı</title>
  <desc id="shd-desc">Odanın metre cinsinden modellendiği, paletlerin sürükle-bırak ile yerleştirildiği ve koridor ile istif kurallarının doğrulandığı 3D depo yerleşim ekranının temsili görüntüsü.</desc>
