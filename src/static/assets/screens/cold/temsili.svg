    <linearGradient id="shA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00bcd4"/><stop offset="1" stop-color="#00838f"/></linearGradient>
    <linearGradient id="shFloor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16233c"/><stop offset="1" stop-color="#0d1729"/></linearGradient>
    <linearGradient id="shPalletTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4fc3f7"/><stop offset="1" stop-color="#1a73e8"/></linearGradient>
    <linearGradient id="shPalletTop2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#81c784"/><stop offset="1" stop-color="#388e3c"/></linearGradient>
    <linearGradient id="shBar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a73e8"/><stop offset="1" stop-color="#0d47a1"/></linearGradient>
  </defs>

  <rect width="1200" height="780" fill="#0c1524"/>

