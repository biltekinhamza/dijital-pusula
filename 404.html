<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add("js");</script>  <!-- JS kapaliyken .reveal bloklari gizli kalmasin -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f8fb">
  <title>Sayfa Bulunamadı | Dijital Pusula</title>
  <link rel="icon" href="/dijital-pusula/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:#10192b;background:radial-gradient(ellipse at 50% 0%,rgba(26,115,232,.06),transparent 60%),#f6f8fb;font-family:system-ui,sans-serif}.wrap{width:min(100%,760px);text-align:center}.logo{display:inline-flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800;text-decoration:none;color:#10192b}.logo em{font-style:normal;color:#0b4fa0}.slogan{margin:14px 0 0;color:#0b4fa0;font-size:.85rem;font-weight:700;letter-spacing:.06em}.mark{display:inline-block;width:34px;height:34px;background:url("/dijital-pusula/assets/logo/logo-mark.svg") center/contain no-repeat;filter:drop-shadow(0 7px 15px rgba(26,115,232,.15))}.code{margin:70px 0 10px;color:#1a73e8;font:700 clamp(5rem,20vw,11rem)/1 "DM Sans",system-ui,sans-serif;letter-spacing:-.1em}h1{margin:0 0 14px;font-size:clamp(1.8rem,5vw,3rem)}p{max-width:560px;margin:0 auto 30px;color:#57667e;line-height:1.7}.button{display:inline-flex;min-height:50px;padding:0 22px;align-items:center;color:white;font-weight:700;text-decoration:none;background:linear-gradient(135deg,#1a73e8,#0d47a1);border-radius:9px}.button.ghost{color:#10192b;background:#fff;border:1px solid rgba(15,23,42,.14)}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.langs{position:fixed;top:25px;right:25px;display:flex;gap:5px}.langs button{padding:6px;color:#8592a8;background:transparent;border:0;cursor:pointer}.langs button.active{color:#10192b;font-weight:700}.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(15,23,42,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.035) 1px,transparent 1px);background-size:64px 64px}
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="langs" aria-label="Dil seçimi / Language selection"><button type="button" data-lang="tr">TR</button><span>/</span><button type="button" data-lang="en">EN</button></div>
  <main class="wrap">
    <a class="logo" href="/dijital-pusula/" aria-label="Dijital Pusula"><span class="mark"></span><span>Dijital<em>Pusula</em></span></a>
    <p class="slogan" id="slogan">Doğru yerdesiniz.</p>
    <div class="code" aria-hidden="true">404</div>
    <h1 id="title">Aradığınız sayfa bulunamadı.</h1>
    <p id="text">Sayfa taşınmış, kaldırılmış veya adres hatalı yazılmış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>
    <div class="actions">
      <a class="button" id="home" href="/dijital-pusula/">Ana Sayfaya Dön</a>
      <a class="button ghost" id="hvac" href="/dijital-pusula/havalandirma-yazilimi.html">HVAC Pro Suite</a>
      <a class="button ghost" id="cold" href="/dijital-pusula/soguk-hava-deposu-yazilimi.html">Soğuk Hava Deposu</a>
    </div>
  </main>
  <script>
    (()=>{const copy={tr:{title:"Aradığınız sayfa bulunamadı.",text:"Sayfa taşınmış, kaldırılmış veya adres hatalı yazılmış olabilir. Ana sayfaya dönerek devam edebilirsiniz.",home:"Ana Sayfaya Dön",slogan:"Doğru yerdesiniz.",page:"Sayfa Bulunamadı | Dijital Pusula"},en:{title:"The page you requested was not found.",text:"The page may have moved, been removed, or the address may be incorrect. Return to the home page to continue.",home:"Return to Home",slogan:"You’re in the right place.",page:"Page Not Found | Dijital Pusula"}};let lang="tr";try{lang=localStorage.getItem("dijital-pusula-language")==="en"?"en":"tr"}catch(e){}function set(next){lang=next;document.documentElement.lang=lang;document.title=copy[lang].page;["title","text","home","slogan"].forEach(id=>document.getElementById(id).textContent=copy[lang][id]);document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));try{localStorage.setItem("dijital-pusula-language",lang)}catch(e){}}document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>set(b.dataset.lang)));set(lang)})();
  </script>
</body>
</html>
