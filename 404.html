<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050d1a">
  <title>Sayfa Bulunamadı | Proje Bahçesi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:#f0f4ff;background:radial-gradient(circle at 70% 20%,rgba(26,115,232,.18),transparent 35%),#050d1a;font-family:system-ui,sans-serif}.wrap{width:min(100%,760px);text-align:center}.logo{display:inline-flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800;text-decoration:none;color:#f0f4ff}.mark{display:inline-block;width:34px;height:34px;background:url("assets/logo/logo-mark.svg") center/contain no-repeat;filter:drop-shadow(0 7px 15px rgba(26,115,232,.25))}.code{margin:70px 0 10px;color:#42a5f5;font:700 clamp(5rem,20vw,11rem)/1 ui-monospace,monospace;letter-spacing:-.1em;text-shadow:0 0 55px rgba(26,115,232,.3)}h1{margin:0 0 14px;font-size:clamp(1.8rem,5vw,3rem)}p{max-width:560px;margin:0 auto 30px;color:#99a6bc;line-height:1.7}.button{display:inline-flex;min-height:50px;padding:0 22px;align-items:center;color:white;font-weight:700;text-decoration:none;background:linear-gradient(135deg,#1a73e8,#0d47a1,#00bcd4);border-radius:9px}.langs{position:fixed;top:25px;right:25px;display:flex;gap:5px}.langs button{padding:6px;color:#7f8da4;background:transparent;border:0;cursor:pointer}.langs button.active{color:#fff}.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(30,136,229,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(30,136,229,.04) 1px,transparent 1px);background-size:64px 64px}
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="langs" aria-label="Dil seçimi / Language selection"><button type="button" data-lang="tr">TR</button><span>/</span><button type="button" data-lang="en">EN</button></div>
  <main class="wrap">
    <a class="logo" href="./" aria-label="Proje Bahçesi"><span class="mark"></span><span>Proje Bahçesi</span></a>
    <div class="code" aria-hidden="true">404</div>
    <h1 id="title">Aradığınız sayfa bulunamadı.</h1>
    <p id="text">Sayfa taşınmış, kaldırılmış veya adres hatalı yazılmış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>
    <a class="button" id="home" href="./">Ana Sayfaya Dön</a>
  </main>
  <script>
    (()=>{const copy={tr:{title:"Aradığınız sayfa bulunamadı.",text:"Sayfa taşınmış, kaldırılmış veya adres hatalı yazılmış olabilir. Ana sayfaya dönerek devam edebilirsiniz.",home:"Ana Sayfaya Dön",page:"Sayfa Bulunamadı | Proje Bahçesi"},en:{title:"The page you requested was not found.",text:"The page may have moved, been removed, or the address may be incorrect. Return to the home page to continue.",home:"Return to Home",page:"Page Not Found | Proje Bahçesi"}};let lang="tr";try{lang=localStorage.getItem("proje-bahcesi-language")==="en"?"en":"tr"}catch(e){}function set(next){lang=next;document.documentElement.lang=lang;document.title=copy[lang].page;["title","text","home"].forEach(id=>document.getElementById(id).textContent=copy[lang][id]);document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));try{localStorage.setItem("proje-bahcesi-language",lang)}catch(e){}}document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>set(b.dataset.lang)));set(lang)})();
  </script>
</body>
</html>
