<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Dijital Pusula automation architecture</title>
  <desc id="desc">A dark software dashboard with connected automation workflow nodes and reporting charts.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050d1a"/><stop offset="1" stop-color="#0a1628"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#1a73e8"/><stop offset=".55" stop-color="#0d47a1"/><stop offset="1" stop-color="#00bcd4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".13" stroke="#7590c8"><path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/></g>
  <rect x="120" y="80" width="960" height="470" rx="24" fill="#0b1323" stroke="#314367" stroke-width="2"/>
  <path d="M120 140h960M205 140v410" stroke="#263653" stroke-width="2"/>
  <circle cx="154" cy="110" r="7" fill="#4e7cff"/><circle cx="178" cy="110" r="7" fill="#8c6bff"/><circle cx="202" cy="110" r="7" fill="#2ed9e6"/>
  <g fill="#1b2a45"><rect x="146" y="184" width="32" height="32" rx="7"/><rect x="146" y="242" width="32" height="32" rx="7"/><rect x="146" y="300" width="32" height="32" rx="7"/><rect x="146" y="358" width="32" height="32" rx="7"/></g>
