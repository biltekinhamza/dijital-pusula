  <g fill="#dce6ff" font-family="Arial" font-size="14" text-anchor="middle"><text x="300" y="360">INPUT</text><text x="550" y="360">RULES</text><text x="800" y="360">API</text><text x="960" y="360">REPORT</text></g>
  <g fill="#121f36" stroke="#283a5b"><rect x="250" y="440" width="225" height="65" rx="10"/><rect x="495" y="440" width="225" height="65" rx="10"/><rect x="740" y="440" width="270" height="65" rx="10"/></g>
